version: '3'

networks:
  # shared-net:
  #     external: true
  airflow_mysql_dag_default:
    external: true
    name: airflow_mysql_dag_default
  dbdl:
    driver: bridge

services:  
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=exampledb
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    networks:
      - dbdl
      - airflow_mysql_dag_default

